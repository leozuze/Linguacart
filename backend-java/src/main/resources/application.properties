# Server configuration
server.port=8080

# LinguaCart Model Service Configuration
linguacart.model-service.mode=${MODEL_SERVICE_MODE:mock}
linguacart.model-service.base-url=${MODEL_SERVICE_URL:http://127.0.0.1:8001}
linguacart.model-service.api-key=${MODEL_SERVICE_API_KEY:}
linguacart.model-service.connect-timeout-ms=2000
linguacart.model-service.translate-read-timeout-ms=120000
linguacart.model-service.embed-read-timeout-ms=15000
# total attempts per call (connection failures and 5xx only)
linguacart.model-service.max-retries=2
linguacart.model-service.retry-backoff-ms=300

# LinguaCart Protection Configuration
linguacart.protection.known-brands=Sony,Apple,Samsung,Dell,HP,Lenovo,Logitech,Philips,BrandX,Anker,Bose,Sennheiser,Canon,Nikon,LG,Asus,Acer,Nike,Adidas,Puma
linguacart.protection.safety-phrases=

# LinguaCart Glossary Configuration
linguacart.glossary.path=${GLOSSARY_PATH:../research/data/glossary/glossary.json}

# LinguaCart Translation Cache
linguacart.cache.max-size=${CACHE_MAX_SIZE:1000}
linguacart.cache.model-version=${CACHE_MODEL_VERSION:nllb-200-distilled-600M-v1}

